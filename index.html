<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Proserve World</title>
<style>
:root {
  --bg: #04070d;
  --panel: rgba(8, 14, 26, 0.90);
  --line: rgba(122, 156, 198, 0.22);
  --text: #e8eef6;
  --muted: #93a5bc;
  --accent: #e8b04b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  touch-action: none;
  position: fixed;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
#stage {
  position: fixed; inset: 0;
  background:
    radial-gradient(55% 45% at 28% 32%, rgba(40, 66, 118, 0.20), transparent 62%),
    radial-gradient(48% 42% at 74% 70%, rgba(72, 50, 108, 0.14), transparent 65%),
    radial-gradient(80% 70% at 50% 50%, rgba(10, 18, 36, 0.35), transparent 80%),
    var(--bg);
}
#stage canvas { display: block; touch-action: none; }

/* project labels for small country views */
#leaders, #labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.leader {
  position: absolute; left: 0; top: 0;
  height: 1px; background: rgba(190, 208, 232, 0.40);
  transform-origin: 0 0;
}
.mlabel {
  position: absolute; left: 0; top: 0;
  pointer-events: auto;
  height: 24px; line-height: 22px;
  padding: 0 9px;
  font-size: 11.5px; font-weight: 500; letter-spacing: 0.02em;
  text-align: left; color: var(--text);
  background: rgba(10, 18, 34, 0.78);
  border: 1px solid rgba(122, 156, 198, 0.30);
  border-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.mlabel:active { border-color: var(--accent); }

header {
  position: fixed; top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 22px 0;
  display: flex; align-items: baseline; gap: 13px;
  pointer-events: none; z-index: 5;
}
.wordmark { font-size: 16px; font-weight: 700; letter-spacing: 0.30em; }
.wordmark span { color: var(--accent); }
.tagline { font-size: 11.5px; letter-spacing: 0.08em; color: var(--muted); }

/* world-view progressive labels: bare type, no chrome */
#wlabels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.wlabel {
  position: absolute; left: 0; top: 0;
  height: 24px; line-height: 24px;
  font-size: 12.5px; font-weight: 300; letter-spacing: 0.14em;
  color: rgba(226, 236, 248, 0.92);
  text-shadow: 0 1px 8px rgba(2, 5, 10, 0.9), 0 0 2px rgba(2, 5, 10, 0.8);
  white-space: nowrap;
}

/* back chip */
#back {
  position: fixed; left: 18px;
  top: calc(env(safe-area-inset-top, 0px) + 52px);
  z-index: 7;
  display: none; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 18px 10px 14px;
  font-size: 13.5px; font-weight: 600; letter-spacing: 0.05em;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#back.show { display: flex; }
#back .bk { color: var(--accent); font-size: 17px; line-height: 1; }

/* collapsed legend: filter button expands the family list */
#filter {
  position: fixed; left: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  z-index: 9;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#filter svg { width: 21px; height: 21px; stroke: var(--accent); fill: none; }
#filter.active { border-color: var(--accent); box-shadow: 0 0 14px rgba(232, 176, 75, 0.35); }
#filter:active { border-color: var(--accent); }
#legend {
  position: fixed; left: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  z-index: 9;
  display: flex; flex-direction: column; gap: 3px;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 9px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  opacity: 0; pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#legend.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
#legend .row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px 5px 7px; border-radius: 999px;
  border: 1px solid transparent;
  text-align: left;
}
#legend .row .dot {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  box-shadow: 0 0 7px 1px currentColor;
}
#legend .row .lbl { font-size: 11.5px; letter-spacing: 0.04em; color: var(--muted); }
#legend .row.active {
  background: rgba(10, 18, 34, 0.85);
  border-color: var(--accent);
}
#legend .row.active .lbl { color: var(--text); }

/* vignette over the scene, under the UI */
#vignette {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(115% 95% at 50% 47%, transparent 52%, rgba(0, 0, 0, 0.46) 100%);
}

/* hint */
#hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  font-size: 13px; letter-spacing: 0.10em; color: var(--text);
  background: rgba(10, 18, 34, 0.8); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 18px;
  z-index: 6; pointer-events: none;
  opacity: 0; transition: opacity 0.8s ease;
}
#hint.show { opacity: 1; }

/* browse button */
#browse {
  position: fixed; right: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  z-index: 9;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#browse svg { width: 22px; height: 22px; stroke: var(--accent); }
#browse:active { border-color: var(--accent); }

/* bottom sheet */
#scrim {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(2, 4, 8, 0.45);
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
#scrim.show { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
  background: var(--panel);
  border-top: 1px solid var(--line);
  border-radius: 18px 18px 0 0;
  max-height: 62vh;
  transform: translateY(105%);
  transition: transform 0.35s cubic-bezier(0.22, 0.9, 0.3, 1);
  display: flex; flex-direction: column;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#sheet.open { transform: translateY(0); }
#sheet-title {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); padding: 16px 22px 10px; flex: none;
}
#sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.srow {
  display: flex; align-items: center; gap: 13px;
  width: 100%; padding: 13px 22px; text-align: left;
  border-top: 1px solid rgba(122, 156, 198, 0.10);
}
.srow:active { background: rgba(122, 156, 198, 0.08); }
.srow .s-flag { font-size: 19px; width: 26px; flex: none; text-align: center; }
.srow .s-name { font-size: 14.5px; font-weight: 500; flex: 1; }
.srow .s-name.s-wide { font-weight: 400; font-size: 13.5px; }
.srow .s-n {
  font-size: 12.5px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.srow.muted .s-name { color: var(--muted); }

/* project card */
#card {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(26px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  width: min(430px, calc(100vw - 32px));
  background: linear-gradient(180deg, rgba(16, 26, 46, 0.78), rgba(8, 14, 26, 0.86));
  border: 1px solid rgba(140, 170, 210, 0.28);
  border-top: 2px solid var(--accent);
  border-radius: 13px;
  padding: 18px 20px 14px;
  backdrop-filter: blur(20px) saturate(1.3);
  -webkit-backdrop-filter: blur(20px) saturate(1.3);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  z-index: 8;
  opacity: 0; pointer-events: none;
  transition: opacity 0.32s ease, transform 0.36s cubic-bezier(0.2, 0.9, 0.3, 1);
}
#card.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#card .c-name { font-size: 16.5px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; padding-right: 26px; }
#card .c-place { font-size: 13px; color: var(--muted); letter-spacing: 0.03em; margin-bottom: 12px; }
#card .c-meta { display: flex; flex-wrap: wrap; gap: 7px 22px; }
#card .c-item .k {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 2px;
}
#card .c-item .v { font-size: 13.5px; font-weight: 500; }
#card .c-item .v.acc { color: var(--accent); }
#card .c-close {
  position: absolute; top: 4px; right: 6px;
  width: 40px; height: 40px; line-height: 40px; text-align: center;
  font-size: 20px; color: var(--muted);
}
#c-stepper {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 13px; padding-top: 11px;
  border-top: 1px solid rgba(122, 156, 198, 0.14);
}
#c-stepper .arr {
  width: 46px; height: 36px; border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 18px; color: var(--accent); line-height: 1;
}
#c-stepper .arr:active { border-color: var(--accent); }
#c-count { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }

/* intro */
#intro {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  background: radial-gradient(ellipse at 50% 42%, rgba(16, 30, 56, 0.92), rgba(4, 7, 13, 0.97) 68%);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  transition: opacity 0.9s ease;
  padding: 0 30px;
}
#intro.hide { opacity: 0; pointer-events: none; }
#intro .i-brand {
  font-size: clamp(30px, 6vw, 50px); font-weight: 700;
  letter-spacing: 0.34em; margin-bottom: 14px; padding-left: 0.34em;
}
#intro .i-brand span { color: var(--accent); }
#intro .i-sub {
  font-size: clamp(15px, 2.6vw, 20px); font-weight: 300;
  letter-spacing: 0.20em; color: var(--muted);
  text-transform: uppercase; margin-bottom: 54px;
}
#intro .i-stats { display: flex; gap: clamp(26px, 7vw, 76px); margin-bottom: 60px; }
#intro .i-stat .n {
  font-size: clamp(26px, 5vw, 42px); font-weight: 200;
  font-variant-numeric: tabular-nums;
}
#intro .i-stat .l {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-top: 8px;
}
#intro .i-btn {
  font-size: 13.5px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--bg); background: var(--accent);
  border-radius: 999px; padding: 15px 46px;
}
#intro .i-btn:active { filter: brightness(1.12); }

#fallback {
  position: fixed; inset: 0; z-index: 30;
  display: none; align-items: center; justify-content: center;
  text-align: center; padding: 40px; color: var(--muted);
  font-size: 15px; line-height: 1.6; background: var(--bg);
}

@media (max-width: 560px) {
  header { justify-content: center; }
  .tagline { display: none; }
  .pill .p-name { font-size: 12px; }
  #legend .row .lbl { font-size: 10.5px; }
  #card { bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); }
}

</style>
</head>
<body>
<div id="stage"></div>

<header>
  <div class="wordmark">PROSERVE<span>.</span></div>
  <div class="tagline">World project track record</div>
</header>

<div id="vignette"></div>
<div id="leaders"></div>
<div id="labels"></div>
<div id="wlabels"></div>

<button id="back"><span class="bk">&#8249;</span> World</button>

<div id="legend"></div>
<div id="hint"></div>

<button id="filter" aria-label="Filter by application">
  <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"></polygon>
  </svg>
</button>

<button id="browse" aria-label="Browse countries">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="4" y1="6" x2="20" y2="6"></line>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <line x1="4" y1="18" x2="14" y2="18"></line>
  </svg>
</button>

<div id="scrim"></div>
<div id="sheet">
  <div id="sheet-title">Browse by country</div>
  <div id="sheet-body"></div>
</div>

<div id="card">
  <button class="c-close" id="c-close">&times;</button>
  <div class="c-name" id="c-name"></div>
  <div class="c-place" id="c-place"></div>
  <div class="c-meta">
    <div class="c-item"><div class="k">Application</div><div class="v" id="c-app"></div></div>
    <div class="c-item"><div class="k">Area</div><div class="v acc" id="c-area"></div></div>
    <div class="c-item"><div class="k">Year</div><div class="v" id="c-year"></div></div>
  </div>
  <div id="c-stepper">
    <button class="arr" id="c-prev">&#8249;</button>
    <span id="c-count"></span>
    <button class="arr" id="c-next">&#8250;</button>
  </div>
</div>

<div id="intro">
  <div class="i-brand">PROSERVE<span>.</span></div>
  <div class="i-sub">Marine scour protection worldwide</div>
  <div class="i-stats">
    <div class="i-stat"><div class="n" id="stat-projects"></div><div class="l">Projects</div></div>
    <div class="i-stat"><div class="n" id="stat-countries"></div><div class="l">Countries</div></div>
    <div class="i-stat"><div class="n"><span id="stat-area"></span></div><div class="l">m&sup2; protected</div></div>
  </div>
  <button class="i-btn" id="i-explore">Explore</button>
</div>

<div id="fallback">This display requires WebGL.<br>Please open it in Safari or another modern browser.</div>

        'varying vec3 vColor;varying float vU;varying float vV;varying float vOn;varying float vPulse;' +
        'void main(){vColor=aColor;vU=aCorner.x;vV=aCorner.y;' +
        'float t=clamp((uReveal-aOrder*0.05)/0.35,0.0,1.0);' +
        'float pop=t*t*(3.0-2.0*t);' +
        'vOn=aOn*step(0.001,pop);' +
        'vPulse=0.84+0.20*sin(uTime*1.15+aPhase);' +
        'vec3 p=position+aAxis*(aH*aCorner.y*pop);' +
        'vec4 mv=modelViewMatrix*vec4(p,1.0);' +
        'vec3 axisV=normalize(normalMatrix*aAxis);' +
        'vec3 sideV=normalize(cross(axisV,vec3(0.0,0.0,1.0)));' +
        'mv.xyz+=sideV*aW*aCorner.x;' +
        'gl_Position=projectionMatrix*mv;}',
      fragmentShader:
        'varying vec3 vColor;varying float vU;varying float vV;varying float vOn;varying float vPulse;' +
        'void main(){if(vOn<0.5)discard;' +
        'float lat=1.0-abs(vU);' +
        'float a=pow(lat,2.3)*pow(1.0-vV,1.7)*vPulse*0.85;' +
        'vec3 col=mix(vColor,vec3(1.0),0.25*(1.0-vV));' +
        'gl_FragColor=vec4(col*a,a);}',
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true
    });
  }
  function buildBeaconLayer(items, opts) {
    var n = items.length;
    var c = new THREE.Color();
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    var size = new Float32Array(n), phase = new Float32Array(n);
    var on = new Float32Array(n), order = new Float32Array(n);
    var pgeo = new THREE.BufferGeometry();
    var ppos = new Float32Array(n * 12), paxis = new Float32Array(n * 12);
    var pcorner = new Float32Array(n * 8), pcol = new Float32Array(n * 12);
    var ph = new Float32Array(n * 4), pw = new Float32Array(n * 4);
    var pon = new Float32Array(n * 4), pphase = new Float32Array(n * 4), porder = new Float32Array(n * 4);
    var idx = new Uint16Array(n * 6);
    var corners = [[-1, 0], [1, 0], [-1, 1], [1, 1]];
    items.forEach(function (it, i) {
      var p = v3(it.lat, it.lng, R * 1.006);
      var axis = p.clone().normalize();
      pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
      c.set(opts.color(it));
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      size[i] = opts.size(it);
      phase[i] = (i * 2.39996) % (Math.PI * 2);
      on[i] = 1; order[i] = 0;
      var H = opts.pillarH(it), W = opts.pillarW(it);
      for (var k = 0; k < 4; k++) {
        var vi = i * 4 + k;
        ppos[vi * 3] = p.x; ppos[vi * 3 + 1] = p.y; ppos[vi * 3 + 2] = p.z;
        paxis[vi * 3] = axis.x; paxis[vi * 3 + 1] = axis.y; paxis[vi * 3 + 2] = axis.z;
        pcorner[vi * 2] = corners[k][0]; pcorner[vi * 2 + 1] = corners[k][1];
        pcol[vi * 3] = c.r; pcol[vi * 3 + 1] = c.g; pcol[vi * 3 + 2] = c.b;
        ph[vi] = H; pw[vi] = W; pon[vi] = 1; pphase[vi] = phase[i]; porder[vi] = 0;
      }
      idx[i * 6] = i * 4; idx[i * 6 + 1] = i * 4 + 1; idx[i * 6 + 2] = i * 4 + 2;
      idx[i * 6 + 3] = i * 4 + 2; idx[i * 6 + 4] = i * 4 + 1; idx[i * 6 + 5] = i * 4 + 3;
    });
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    geo.setAttribute('aOn', new THREE.BufferAttribute(on, 1));
    geo.setAttribute('aOrder', new THREE.BufferAttribute(order, 1));
    pgeo.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
    pgeo.setAttribute('aAxis', new THREE.BufferAttribute(paxis, 3));
    pgeo.setAttribute('aCorner', new THREE.BufferAttribute(pcorner, 2));
    pgeo.setAttribute('aColor', new THREE.BufferAttribute(pcol, 3));
    pgeo.setAttribute('aH', new THREE.BufferAttribute(ph, 1));
    pgeo.setAttribute('aW', new THREE.BufferAttribute(pw, 1));
    pgeo.setAttribute('aOn', new THREE.BufferAttribute(pon, 1));
    pgeo.setAttribute('aPhase', new THREE.BufferAttribute(pphase, 1));
    pgeo.setAttribute('aOrder', new THREE.BufferAttribute(porder, 1));
    pgeo.setIndex(new THREE.BufferAttribute(idx, 1));
    var uReveal = { value: opts.cascade ? 0 : 999 };
    var pointsMat = beaconPointsMaterial(uReveal);
    var points = new THREE.Points(geo, pointsMat);
    var pillars = new THREE.Mesh(pgeo, pillarMaterial(uReveal));
    pillars.frustumCulled = false;
    yawGroup.add(points); yawGroup.add(pillars);
    return { points: points, geo: geo, mat: pointsMat, pgeo: pgeo, items: items, uReveal: uReveal };
  }
  function setLayerState(layer, i, visible, ord) {
    layer.geo.getAttribute('aOn').array[i] = visible ? 1 : 0;
    layer.geo.getAttribute('aOrder').array[i] = ord;
    var pon = layer.pgeo.getAttribute('aOn').array;
    var pord = layer.pgeo.getAttribute('aOrder').array;
    for (var k = 0; k < 4; k++) { pon[i * 4 + k] = visible ? 1 : 0; pord[i * 4 + k] = ord; }
  }
  function flushLayer(layer) {
    layer.geo.getAttribute('aOn').needsUpdate = true;
    layer.geo.getAttribute('aOrder').needsUpdate = true;
    layer.pgeo.getAttribute('aOn').needsUpdate = true;
    layer.pgeo.getAttribute('aOrder').needsUpdate = true;
  }

  var familyColor = {};
  PW.FAMILIES.forEach(function (f) { familyColor[f.key] = f.color; });

  var countryLayer = buildBeaconLayer(COUNTRIES, {
    color: function () { return '#e8b04b'; },
    size: function (cc) { return Math.min(15, 8 + Math.sqrt(cc.count) * 0.42); },
    pillarH: function (cc) { return 3 + Math.min(10, Math.sqrt(cc.count) * 0.55); },
    pillarW: function () { return 1.5; }
  });
  var groupLayer = buildBeaconLayer(GROUPS, {
    color: function (g) { return familyColor[g.family]; },
    size: function (g) {
      var s = 9 + Math.max(0, Math.log(Math.max(g.maxArea, 60)) / Math.LN10 - 1.2) * 1.6;
      return Math.min(17, s + Math.min(2.4, (g.members.length - 1) * 0.5));
    },
    pillarH: function (g) {
      return 2.5 + Math.min(12, Math.max(0, Math.log(Math.max(g.maxArea, 60)) / Math.LN10 - 1) * 3.0);
    },
    pillarW: function (g) { return 1.1 + Math.min(1.0, (g.members.length - 1) * 0.18); },
    cascade: true
  });

  /* highlight ring */
  var highlight = new THREE.Mesh(
    new THREE.RingGeometry(3.4, 4.0, 40),
    new THREE.MeshBasicMaterial({
      color: 0xe8b04b, transparent: true, opacity: 0,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  yawGroup.add(highlight);
  function placeHighlight(lat, lng) {
    var p = v3(lat, lng, R * 1.018);
    highlight.position.copy(p);
    highlight.lookAt(p.clone().multiplyScalar(2));
    highlight.material.opacity = 0.95;
  }
  function clearHighlight() { highlight.material.opacity = 0; }

  /* ---------- state ---------- */
  var nav = PW.navInit();
  var EUROPE = PW.orient(47, 4);
  var yaw = EUROPE.yaw - 1.15, pitch = EUROPE.pitch * 0.4;
  var yawVel = 0, pitchVel = 0;
  var dist = 470, distTarget = 470;
  var DIST_MIN = 150, DIST_MAX = 480, L2_EXIT_DIST = 345;
  var fly = null;
  var lastInteraction = Date.now();
  var introDismissed = false;
  var hadFirstTap = false, hadL2Hint = false;
  var revealStart = -999;

  function nearestAngle(t, c) {
    var TWO = Math.PI * 2;
    while (t - c > Math.PI) t -= TWO;
    while (t - c < -Math.PI) t += TWO;
    return t;
  }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function flyTo(lat, lng, targetDist, then, durOverride) {
    var o = PW.orient(lat, lng);
    fly = {
      t: 0,
      dur: durOverride || Math.min(3.0, Math.max(1.2,
        (Math.abs(nearestAngle(o.yaw, yaw) - yaw) + Math.abs(o.pitch - pitch)) * 1.0)),
      fromYaw: yaw, fromPitch: pitch, fromDist: dist,
      toYaw: nearestAngle(o.yaw, yaw), toPitch: o.pitch, toDist: targetDist,
      then: then || null
    };
    yawVel = 0; pitchVel = 0;
  }
  function countryDist(c) {
    return Math.max(185, Math.min(330, 185 + c.spread * 7.5));
  }

  /* ---------- DOM ---------- */
  var wlabelsEl = document.getElementById('wlabels');
  var labelsEl = document.getElementById('labels');

  function setHint(text) {
    if (text) { hint.textContent = text; hint.classList.add('show'); }
    else hint.classList.remove('show');
  }

  /* world labels: anonymous beacons, names only near screen centre */
  var counts = {};
  function refreshCounts() {
    COUNTRIES.forEach(function (c) { counts[c.name] = PW.countryCount(c, nav.filter); });
    wlabels.forEach(function (l) {
      l.el.textContent = l.c.name + ' · ' + PW.fmt(counts[l.c.name]);
    });
  }
  var wlabels = COUNTRIES.map(function (c) {
    var el = document.createElement('div');
    el.className = 'wlabel';
    wlabelsEl.appendChild(el);
    return { el: el, c: c, base: v3(c.lat, c.lng, R * 1.03), o: 0, rect: null };
  });
  refreshCounts();

  var wlV = new THREE.Vector3();
  function syncWorldLabels(dt) {
    var w = window.innerWidth, h = window.innerHeight;
    var cands = [];
    if (nav.level === 1) {
      wlabels.forEach(function (l, i) {
        l.front = false;
        if (counts[l.c.name] === 0) return;
        wlV.copy(l.base);
        yawGroup.localToWorld(wlV);
        if (wlV.z < R * 0.34) return;
        wlV.project(camera);
        var x = (wlV.x * 0.5 + 0.5) * w, y = (-wlV.y * 0.5 + 0.5) * h;
        if (x < 30 || x > w - 30 || y < 70 || y > h - 110) return;
        l.front = true; l.sx = x; l.sy = y;
        cands.push({ id: i, x: x, y: y, text: l.c.name + ' · ' + PW.fmt(counts[l.c.name]) });
      });
    }
    var picked = PW.worldLabelPick(cands, w / 2, h * 0.45);
    var rects = PW.layoutLabels(picked, w, h);
    var byId = {};
    rects.forEach(function (r) { byId[r.id] = r; });
    wlabels.forEach(function (l, i) {
      var r = byId[i];
      var target = r ? 1 : 0;
      l.o += (target - l.o) * Math.min(1, dt * 4.5);
      if (r) l.rect = r;
      if (l.o < 0.03 || !l.rect) {
        l.el.style.display = 'none';
        return;
      }
      l.el.style.display = '';
      l.el.style.opacity = l.o.toFixed(2);
      l.el.style.transform = 'translate(' + l.rect.x.toFixed(1) + 'px,' + l.rect.y.toFixed(1) + 'px)';
    });
  }

  /* ---------- country-view project labels (15 or fewer) ---------- */
  var labels = [];
  function rebuildLabels() {
    labelsEl.innerHTML = '';
    leadersEl.innerHTML = '';
    labels = [];
    if (nav.level !== 2) return;
    var c = countryByName[nav.country];
    if (!c) return;
    var entries = PW.labelEntries(c, nav.filter);
    if (!entries) return;
    entries.forEach(function (en, i) {
      var el = document.createElement('button');
      el.className = 'mlabel';
      el.textContent = en.text;
      el.addEventListener('click', function (e) {
        e.stopPropagation(); userActed();
        var members = PW.visibleMembers(en.group, nav.filter);
        openCard(members, Math.min(en.memberIndex, members.length - 1));
      });
      labelsEl.appendChild(el);
      var line = document.createElement('div');
      line.className = 'leader';
      leadersEl.appendChild(line);
      labels.push({
        el: el, line: line, entry: en, id: i,
        base: v3(en.group.lat, en.group.lng, R * 1.012)
      });
    });
  }
  var labelV = new THREE.Vector3();
  function syncLabels() {
    if (!labels.length) return;
    var w = window.innerWidth, h = window.innerHeight;
    var ents = [];
    labels.forEach(function (l) {
      labelV.copy(l.base);
      yawGroup.localToWorld(labelV);
      var behind = labelV.z < R * 0.20;
      labelV.project(camera);
      var x = (labelV.x * 0.5 + 0.5) * w, y = (-labelV.y * 0.5 + 0.5) * h;
      l.sx = x; l.sy = y;
      l.hidden = behind || x < -60 || x > w + 60 || y < -40 || y > h + 40;
      if (!l.hidden) ents.push({ id: l.id, x: x, y: y, text: l.entry.text });
    });
    var placed = PW.layoutLabels(ents, w, h);
    var byId = {};
    placed.forEach(function (r) { byId[r.id] = r; });
    labels.forEach(function (l) {
      var r = byId[l.id];
      if (l.hidden || !r) {
        l.el.style.display = 'none';
        l.line.style.display = 'none';
        return;
      }
      l.el.style.display = '';
      l.el.style.transform = 'translate(' + r.x.toFixed(1) + 'px,' + r.y.toFixed(1) + 'px)';
      l.el.style.width = r.w.toFixed(0) + 'px';
      var ex = r.side === 'right' ? r.x : r.x + r.w;
      var ey = r.y + r.h / 2;
      var dx = ex - l.sx, dy = ey - l.sy;
      var len = Math.sqrt(dx * dx + dy * dy);
      l.line.style.display = '';
      l.line.style.width = len.toFixed(1) + 'px';
      l.line.style.transform = 'translate(' + l.sx.toFixed(1) + 'px,' + l.sy.toFixed(1) +
        'px) rotate(' + Math.atan2(dy, dx).toFixed(4) + 'rad)';
    });
  }

  /* ---------- effects ---------- */
  function applyMarkers() {
    COUNTRIES.forEach(function (c, i) {
      var visible = (nav.level === 1 || nav.country !== c.name) &&
                    PW.countryCount(c, nav.filter) > 0;
      setLayerState(countryLayer, i, visible, 0);
    });
    flushLayer(countryLayer);
    var ord = 0;
    var active = nav.level === 2 ? nav.country : null;
    var ordered = GROUPS.map(function (g, i) { return { g: g, i: i }; })
      .sort(function (a, b) { return a.g.lng - b.g.lng || a.g.lat - b.g.lat; });
    ordered.forEach(function (gi) {
      var show = active === gi.g.country && PW.groupVisible(gi.g, nav.filter);
      setLayerState(groupLayer, gi.i, show, show ? ord++ : 0);
    });
    flushLayer(groupLayer);
    backChip.classList.toggle('show', nav.level === 2);
    rebuildLabels();
  }

  function enterCountry(name, opts) {
    var c = countryByName[name];
    if (!c) return;
    nav = PW.navReduce(nav, { type: 'ENTER_COUNTRY', name: name });
    revealStart = uTime.value + 0.45;
    applyMarkers(); refreshCounts(); renderCard();
    flyTo(c.lat, c.lng, countryDist(c), (opts && opts.then) || null);
    closeSheet(); closeLegend();
    if (!hadL2Hint && !tour.active) {
      hadL2Hint = true;
      setHint('Tap a project for details');
      setTimeout(function () { setHint(null); }, 5000);
    }
  }
  function exitToWorld() {
    nav = PW.navReduce(nav, { type: 'EXIT_WORLD' });
    revealStart = -999;

    distTarget = 300;
    fly = { t: 0, dur: 0.9, fromYaw: yaw, fromPitch: pitch, fromDist: dist,
            toYaw: yaw, toPitch: pitch, toDist: 300, then: null };
  }
  backChip.addEventListener('click', function (e) { e.stopPropagation(); userActed(); exitToWorld(); });

  /* ---------- card ---------- */
  function openCard(members, index) {
    nav = PW.navReduce(nav, { type: 'OPEN_CARD', members: members, index: index || 0 });
    renderCard();
  }
  function renderCard() {
    if (!nav.card || !nav.card.length) {
      card.classList.remove('open');
      clearHighlight();
      return;
    }
    var p = nav.card[nav.cardIndex];
    document.getElementById('c-name').textContent = p.name || 'Project';
    var bits = [];
    if (p.place) bits.push(p.place);
    if (p.country && (!p.place || p.place.toLowerCase().indexOf(p.country.toLowerCase()) === -1)) bits.push(p.country);
    document.getElementById('c-place').textContent = bits.join(' · ') || 'Location not recorded';
    var fam = PW.familyOf(p.application);
    var app = p.application ? p.application.replace(/^\s*\d+\s*-\s*/, '') : null;
    setMeta('c-app', app || fam.label);
    setMeta('c-area', p.area_m2 ? PW.fmt(p.area_m2) + ' m²' : null);
    setMeta('c-year', p.year ? String(p.year) : null);
    var stepper = document.getElementById('c-stepper');
    if (nav.card.length > 1) {
      stepper.style.display = '';
      document.getElementById('c-count').textContent =
        (nav.cardIndex + 1) + ' of ' + nav.card.length;
    } else {
      stepper.style.display = 'none';

    card.classList.add('open');
    if (PW.isPlotted(p)) placeHighlight(p.lat, p.lng);
    else clearHighlight();

  /* ---------- tour ---------- */
  var tour = { active: false, idx: 0, t: 0, phase: 'idle' };
  function startTour() {
    tour.active = true; tour.idx = -1;
    if (nav.filter) {
      nav = PW.navReduce(nav, { type: 'SET_FILTER', key: nav.filter });
      legendEl.querySelectorAll('.row').forEach(function (r) { r.classList.remove('active'); });
      filterBtn.classList.remove('active');
    }
    closeSheet(); closeLegend(); setHint(null);
    nextTourStop();
  }
  function nextTourStop() {
    tour.idx = (tour.idx + 1) % FLAGS.length;
    var p = FLAGS[tour.idx].project;
    tour.phase = 'fly'; tour.t = 0;
    nav = PW.navReduce(nav, { type: 'CLOSE_CARD' }); renderCard();
    var c = countryByName[p.country];
    if (c) {
      nav = PW.navReduce(nav, { type: 'ENTER_COUNTRY', name: p.country });
      revealStart = uTime.value + 0.45;
      applyMarkers(); refreshCounts();
    }
    flyTo(p.lat, p.lng, c ? Math.min(countryDist(c), 250) : 250, function () {
      if (!tour.active) return;
      tour.phase = 'hold'; tour.t = 0;
      var members = [p];
      var g = GROUPS.find(function (gg) {
        return gg.country === p.country && PW.locKey(gg.lat, gg.lng) === PW.locKey(p.lat, p.lng);
      });
      if (g) {
        members = g.members;
        var at = members.indexOf(p);
        openCard(members, at >= 0 ? at : 0);
      } else {
        openCard(members, 0);
      }
    });
  }
  function stopTour() {
    if (!tour.active) return;
    tour.active = false; tour.phase = 'idle';
    fly = null;
  }
  function userActed() {
    lastInteraction = Date.now();
    stopTour();
    if (!hadFirstTap) { hadFirstTap = true; setHint(null); }
  }

  /* ---------- pointer controls ---------- */
  var pointers = {};
  var dragMoved = 0, downAt = 0, downXY = null, pinchDist = 0;
  function onDown(x, y, id) {
    pointers[id] = { x: x, y: y };
    var keys = Object.keys(pointers);
    if (keys.length === 1) {
      dragMoved = 0; downAt = Date.now(); downXY = [x, y];
      yawVel = 0; pitchVel = 0; fly = null;
    } else if (keys.length === 2) {
      var a = pointers[keys[0]], b = pointers[keys[1]];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
    userActed();
  }
  function onMove(x, y, id) {
    var pt = pointers[id];
    if (!pt) return;
    var keys = Object.keys(pointers);
    if (keys.length === 1) {
      var dx = x - pt.x, dy = y - pt.y;
      dragMoved += Math.abs(dx) + Math.abs(dy);
      var k = 0.0042 * (dist / 330);
      yaw += dx * k; pitch += dy * k;
      pitch = Math.max(-1.25, Math.min(1.25, pitch));
      yawVel = dx * k; pitchVel = dy * k;
    }
    pt.x = x; pt.y = y;
    if (keys.length === 2) {
      var a = pointers[keys[0]], b = pointers[keys[1]];
      var d2 = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) {
        distTarget = Math.max(DIST_MIN, Math.min(DIST_MAX, distTarget * pinchDist / d2));
      }
      pinchDist = d2;
    }
    lastInteraction = Date.now();
  }
  function onUp(x, y, id) {
    delete pointers[id];
    pinchDist = 0;
    if (downXY && dragMoved < 12 && Date.now() - downAt < 600) handleTap(x, y);
    downXY = null;
    lastInteraction = Date.now();
  }
  var el = renderer.domElement;
  el.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i]; onDown(t.clientX, t.clientY, t.identifier);
    }
  }, { passive: false });
  el.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i]; onMove(t.clientX, t.clientY, t.identifier);
    }
  }, { passive: false });
  function touchEnd(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i]; onUp(t.clientX, t.clientY, t.identifier);
    }
  }
  el.addEventListener('touchend', touchEnd, { passive: false });
  el.addEventListener('touchcancel', touchEnd, { passive: false });
  el.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY, 'm'); });
  window.addEventListener('mousemove', function (e) { if (pointers.m) onMove(e.clientX, e.clientY, 'm'); });
  window.addEventListener('mouseup', function (e) { if (pointers.m) onUp(e.clientX, e.clientY, 'm'); });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    distTarget = Math.max(DIST_MIN, Math.min(DIST_MAX, distTarget + e.deltaY * 0.4));
    userActed();
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  /* ---------- tap picking ---------- */
  var raycaster = new THREE.Raycaster();
  raycaster.params.Points = { threshold: 7 };
  var ndc = new THREE.Vector2(), tmpV = new THREE.Vector3();
  function pick(layer, x, y, threshold) {
    ndc.x = (x / window.innerWidth) * 2 - 1;
    ndc.y = -(y / window.innerHeight) * 2 + 1;
    raycaster.params.Points.threshold = threshold * (dist / 300);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObject(layer.points);
    var on = layer.geo.getAttribute('aOn');
    var best = null;
    hits.forEach(function (h) {
      if (!on.array[h.index]) return;
      tmpV.fromBufferAttribute(layer.geo.getAttribute('position'), h.index);
      layer.points.localToWorld(tmpV);
      if (tmpV.z < R * 0.1) return;
      if (!best || h.distanceToRay < best.distanceToRay) best = h;
    });
    return best ? layer.items[best.index] : null;
  }
  function handleTap(x, y) {
    closeLegend();
    if (nav.level === 2) {
      var g = pick(groupLayer, x, y, 7);
      if (g) {
        var members = PW.visibleMembers(g, nav.filter);
        openCard(members.length ? members : g.members, 0);
        return;
      }
      var c2 = pick(countryLayer, x, y, 8);
      if (c2) { enterCountry(c2.name); return; }
      nav = PW.navReduce(nav, { type: 'CLOSE_CARD' });
      renderCard();
    } else {
      var c = pick(countryLayer, x, y, 9);
      if (c) { enterCountry(c.name); return; }
      nav = PW.navReduce(nav, { type: 'CLOSE_CARD' });
      renderCard();
    }
  }

  /* ---------- resize ---------- */
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 320); });

  /* ---------- main loop ---------- */
  applyMarkers();
  var clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var now = Date.now();
    var idle = (now - lastInteraction) / 1000;
    var dragging = Object.keys(pointers).length > 0;

    if (fly) {
      fly.t += dt;
      var k = easeInOut(Math.min(1, fly.t / fly.dur));
      yaw = fly.fromYaw + (fly.toYaw - fly.fromYaw) * k;
      pitch = fly.fromPitch + (fly.toPitch - fly.fromPitch) * k;
      dist = fly.fromDist + (fly.toDist - fly.fromDist) * k;
      distTarget = fly.toDist;
      if (fly.t >= fly.dur) {
        var done = fly.then; fly = null;
        if (done) done();
      }
    } else if (tour.active && tour.phase === 'hold') {
      tour.t += dt;
      yaw += 0.012 * dt;
      if (tour.t >= 8) nextTourStop();
    } else {
      if (!dragging) {
        yaw += yawVel; pitch += pitchVel;
        pitch = Math.max(-1.25, Math.min(1.25, pitch));
        yawVel *= 0.94; pitchVel *= 0.94;
        if (introDismissed && idle > 4 && nav.level === 1) yaw += 0.025 * dt;
      }
      dist += (distTarget - dist) * Math.min(1, dt * 7);
      if (nav.level === 2 && dist > L2_EXIT_DIST && !tour.active) exitToWorld();
    }
    if (introDismissed && idle > 60 && !tour.active) startTour();

    yawGroup.rotation.y = yaw;
    pitchGroup.rotation.x = pitch;
    starGroup.rotation.y += 0.0028 * dt;
    camera.position.z = dist;
    yawGroup.updateMatrixWorld();
    uTime.value += dt;
    groupLayer.uReveal.value = Math.max(0, uTime.value - revealStart);
    countryLayer.mat.uniforms.uScale.value = 300 / dist;
    groupLayer.mat.uniforms.uScale.value = 300 / dist;
    syncWorldLabels(dt);
    syncLabels();
    renderer.render(scene, camera);
  }
  animate();
})();

</script>
</body>
</html>
